# Install as:
#   /etc/nginx/sites-available/mas-storage-seaweedfs.com.conf
# Then enable it with:
#   sudo ln -s /etc/nginx/sites-available/mas-storage-seaweedfs.com.conf \
#     /etc/nginx/sites-enabled/mas-storage-seaweedfs.com.conf
#
# This HTTP-only configuration is intended for local/private use. Add TLS
# before exposing the S3 endpoint outside a trusted network.

server {
    listen 80;
    listen [::]:80;
    server_name mas-storage-seaweedfs.com;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:28333;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.mas-storage-seaweedfs.com;

    location / {
        proxy_pass http://127.0.0.1:29333;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
